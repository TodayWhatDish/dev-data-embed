[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-data-embed"
version = "1.1.0"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlite-vec",
    "sentence-transformers",
    "pyjwt",
    "requests",
    "langchain",
    "langchain-core",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-text-splitters",
    "transformers",
    "bcrypt",
]

# 테스트에서만 쓰는 것들. 배포에 pytest 가 끼면 안 되니 dependencies 와 갈라 둔다.
# httpx 는 tests/bench/http.py 가 쓴다 - 지금까지 langchain 이 딸려 오는 것에 얹혀 있었다
[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

# 자체검증 모아 돌리기. 수집 대상은 tests/test_selfchecks.py 하나뿐이다 -
# 나머지 tests/*.py 는 test_ 로 시작하지 않아 pytest 가 안 줍는다(단독 실행 스크립트라서)
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: 임베딩 모델을 올리거나 DB 에 쓴다. 기본 실행에서 빠진다"]


[tool.setuptools.packages.find]
include = ["app*","pipeline*"]
namespaces= true