# API 서버를 띄운다. 저장소 루트(dev-data-embed)에서 실행한다.
# 프론트(dev-web/web, Next.js)는 Vercel 로 배포해 여기 없다 - 예전 web 서비스는 죽은 코드
# (dev-web/frontend)를 틀린 경로로 가리키고 있어 뺐다. Docker 로 옮기면 그때 다시 넣는다(FE-28).
services:
  api:
    build: .
    env_file: [.env, .env.local]  # 뒤에 올수록 우선 - .env는 빈 템플릿, .env.local이 실제 값
    volumes:
      - ./data:/app/data    # docker run -v "${PWD}/data:/app/data" 와 같은 일
    ports:
      - "8000:8000"         # 디버깅용. 프록시가 안정되면 expose 로 바꿔 밖에서 막는다
    restart: unless-stopped

