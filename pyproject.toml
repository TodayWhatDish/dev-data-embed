[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-data-embed"
version = "1.1.0"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlite-vec",
    "sentence-transformers",
    "pyjwt",
    "requests",
    "langchain",
    "langchain-core",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-text-splitters",
    "transformers",
    "bcrypt",
]

# 테스트에서만 쓰는 것들. 배포에 pytest 가 끼면 안 되니 dependencies 와 갈라 둔다.
# httpx 는 tests/bench/http.py 가 쓴다 - 지금까지 langchain 이 딸려 오는 것에 얹혀 있었다
[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

# 채점기(eval/*)에만 필요하다. 서버를 돌리는 데는 하나도 안 쓴다 - ragas 가 pandas 와
# datasets 를 끌고 와서 100개 넘는 패키지가 딸려 오므로 dependencies 에 넣으면 안 된다.
#
# langchain-community 를 0.3.x 로 묶는 이유: ragas 0.4.3 의 ragas/llms/base.py 가
# langchain_community.chat_models.vertexai 를 무조건 import 하는데, 0.4.x 에서 그 모듈이
# 없어져 `import ragas` 자체가 ModuleNotFoundError 로 죽는다. 이 저장소의 app/ 은
# langchain_community 를 한 군데도 안 쓰므로 내려도 서버에 영향이 없다.
eval = [
    "ragas~=0.4.3",
    "langchain-community~=0.3.31",
]

# 채점을 LangSmith 로도 보고 싶을 때만. 없으면 eval/tracing.py 가 조용히 통과하고
# data/eval/runs.jsonl 에는 그대로 남는다.
trace = [
    "langsmith",
]

# 자체검증 모아 돌리기. 수집 대상은 tests/test_selfchecks.py 하나뿐이다 -
# 나머지 tests/*.py 는 test_ 로 시작하지 않아 pytest 가 안 줍는다(단독 실행 스크립트라서)
[tool.pytest.ini_options]
testpaths = ["tests"]
# no:cacheprovider - .pytest_cache 를 만들 때 Windows 가 WinError 5 로 막는 환경이 있다.
# 12개 6초짜리라 --lf 를 쓸 일이 없어 캐시를 아예 끈다
addopts = "-m 'not slow' -p no:cacheprovider"
markers = ["slow: 임베딩 모델을 올리거나 DB 에 쓴다. 기본 실행에서 빠진다"]


[tool.setuptools.packages.find]
include = ["app*","pipeline*","eval*"]
namespaces= true